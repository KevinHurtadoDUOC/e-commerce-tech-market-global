spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: login-service
              uri: lb://login-service
              predicates:
                - Path=/api/v1/login/**, /v3/api-docs/login
              filters:
                - RewritePath=/v3/api-docs/login, /v3/api-docs

            - id: vendedores-service
              uri: lb://vendedores-service
              predicates:
                - Path=/api/v1/vendedores/**, /v3/api-docs/vendedores
              filters:
                - RewritePath=/v3/api-docs/vendedores, /v3/api-docs

            - id: clientes-service
              uri: lb://clientes-service
              predicates:
                - Path=/api/v1/clientes/**, /v3/api-docs/clientes
              filters:
                - RewritePath=/v3/api-docs/clientes, /v3/api-docs

            - id: sucursales-service
              uri: lb://sucursales-service
              predicates:
                - Path=/api/v1/sucursales/**, /v3/api-docs/sucursales
              filters:
                - RewritePath=/v3/api-docs/sucursales, /v3/api-docs

            - id: bodegas-service
              uri: lb://bodegas-service
              predicates:
                - Path=/api/v1/bodegas/**, /v3/api-docs/bodegas
              filters:
                - RewritePath=/v3/api-docs/bodegas, /v3/api-docs

            - id: productos-service
              uri: lb://productos-service
              predicates:
                - Path=/api/v1/productos/**, /v3/api-docs/productos
              filters:
                - RewritePath=/v3/api-docs/productos, /v3/api-docs

            - id: ventas-service
              uri: lb://ventas-service
              predicates:
                - Path=/api/v1/ventas/**, /api/v1/detalles-venta/**, /v3/api-docs/ventas
              filters:
                - RewritePath=/v3/api-docs/ventas, /v3/api-docs

            - id: proveedores-service
              uri: lb://proveedores-service
              predicates:
                - Path=/api/v1/proveedores/**, /v3/api-docs/proveedores
              filters:
                - RewritePath=/v3/api-docs/proveedores, /v3/api-docs

server:
  port: 8080

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: Bodegas
        url: /v3/api-docs/bodegas
      - name: Clientes
        url: /v3/api-docs/clientes
      - name: Login
        url: /v3/api-docs/login
      - name: Productos
        url: /v3/api-docs/productos
      - name: Proveedores
        url: /v3/api-docs/proveedores
      - name: Sucursales
        url: /v3/api-docs/sucursales
      - name: Vendedores
        url: /v3/api-docs/vendedores
      - name: Ventas
        url: /v3/api-docs/ventas